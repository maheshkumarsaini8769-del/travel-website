<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 120" width="820" height="120">
  <defs>
    <linearGradient id="redToOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E8192C"/>
      <stop offset="45%" stop-color="#E8451C"/>
      <stop offset="100%" stop-color="#F5821F"/>
    </linearGradient>
  </defs>
  
  <!-- SUNSKY TOURISM text with gradient -->
  <text x="0" y="88" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="96" fill="url(#redToOrange)" letter-spacing="-2">SUNSKY TOURISM</text>
  
  <!-- Saffron turban on the T -->
  <g transform="translate(395, 8)">
    <!-- Turban base -->
    <ellipse cx="18" cy="22" rx="16" ry="10" fill="#E8451C"/>
    <!-- Turban folds -->
    <path d="M6,18 Q10,4 18,2 Q26,4 30,18" fill="#F5821F" stroke="#D4380D" stroke-width="0.5"/>
    <path d="M8,20 Q14,8 18,6 Q22,8 28,20" fill="#E8451C"/>
    <path d="M10,22 Q15,12 18,10 Q21,12 26,22" fill="#D4380D"/>
    <!-- Turban knot/detail -->
    <circle cx="18" cy="6" r="4" fill="#F5821F"/>
    <path d="M14,4 Q18,0 22,4" fill="#E8451C" stroke="#D4380D" stroke-width="0.5"/>
    <!-- Turban tail -->
    <path d="M28,16 Q34,20 32,30 Q30,36 26,32" fill="#E8451C" stroke="#D4380D" stroke-width="0.5"/>
    <path d="M30,18 Q36,22 34,30 Q32,34 28,30" fill="#F5821F"/>
  </g>
</svg>
